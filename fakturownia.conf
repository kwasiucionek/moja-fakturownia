# /etc/nginx/sites-available/fakturownia.conf
# Konfiguracja Nginx dla aplikacji PWA Fakturownia na mikr.us

map $sent_http_content_type $cache_control {
    default                         "public, max-age=3600";
    ~image/                         "public, max-age=604800, immutable";
    ~font/                          "public, max-age=31536000, immutable";
    ~text/css                       "public, max-age=604800, immutable";
    ~application/javascript         "public, max-age=604800, immutable";
}

server {
    # Mikrus routuje moja-fakturownia.cytr.us -> roman233.mikrus.xyz:30233
    # -> 192.168.2.133:30233, więc nginx MUSI słuchać na 30233, nie na 80.
    listen      30233;
    listen      [::]:30233;
    server_name moja-fakturownia.cytr.us;

    access_log  /var/log/nginx/fakturownia_access.log;
    error_log   /var/log/nginx/fakturownia_error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/x-javascript
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # =================================================================
    # LOKALIZACJE DLA PLIKÓW PWA
    # =================================================================

    location = /sw.js {
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        expires off;
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
        add_header Content-Type "application/manifest+json";
    }

    location = /offline.html {
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
    }

    # =================================================================
    # PLIKI STATYCZNE I MEDIA
    # =================================================================

    location /static/pwa/ {
        alias /cytrus/fakturownia/staticfiles/pwa/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /cytrus/fakturownia/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /cytrus/fakturownia/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # =================================================================
    # SERWER MCP ASYSTENTA (uvicorn, fakturownia-mcp.service)
    # =================================================================
    location = /mcp {
        proxy_pass          http://127.0.0.1:8501;
        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_buffering     off;
        proxy_read_timeout  300s;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass          http://127.0.0.1:8501;
        proxy_set_header    Host                $host;
    }

    # =================================================================
    # GŁÓWNA APLIKACJA DJANGO (GUNICORN)
    # =================================================================
    location / {
        proxy_pass          http://127.0.0.1:8500;
        proxy_redirect      off;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    client_max_body_size 10M;

    error_page 502 /502.html;
    location = /502.html {
        internal;
        root /usr/share/nginx/html;
    }
}
