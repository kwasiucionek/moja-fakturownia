<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Brak dostępu (403)</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; color: #333;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #fff; border-radius: 8px; padding: 2.5rem 3rem; box-shadow: 0 2px 12px rgba(0,0,0,.08);
               max-width: 480px; text-align: center; }
        h1 { font-size: 3rem; margin: 0 0 .5rem; color: #dc3545; }
        p { line-height: 1.5; }
        a { color: #004a99; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .user { color: #666; font-size: .95rem; }
        button { background: #004a99; color: #fff; border: 0; border-radius: 4px; padding: .55rem 1.2rem;
                 font-size: 1rem; cursor: pointer; }
        button:hover { background: #003a7a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>403</h1>
        <p>Brak uprawnień do wyświetlenia tej strony.</p>
        {% if request.user.is_authenticated %}
        <p class="user">Zalogowano jako <strong>{{ request.user.username }}</strong>.</p>
        <form method="post" action="{% url 'auth:logout' %}">
            {% csrf_token %}
            <button type="submit">Wyloguj i zaloguj na inne konto</button>
        </form>
        <p><a href="{% url 'admin:index' %}">Panel</a></p>
        {% else %}
        <p><a href="/">Wróć na stronę główną</a></p>
        {% endif %}
    </div>
</body>
</html>
